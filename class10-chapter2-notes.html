<!DOCTYPE html>

<head>

<meta charset="UTF-8">

<title>Class 10 Chapter 2 Notes | GSI MANTRA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

/* WATERMARK */

.watermark{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) rotate(-25deg);
    font-size:75px;
    font-weight:bold;
    color:rgba(18,60,105,0.05);
    pointer-events:none;
    z-index:0;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#0b2948,#1d5b91);
    color:white;
    text-align:center;
    padding:45px 20px;
    position:relative;
    z-index:1;
}

header h1{
    margin:0;
    font-size:38px;
}

header p{
    margin:10px 0 0;
    font-size:17px;
}

/* MAIN */

.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
    position:relative;
    z-index:1;
}

/* CARD */

.card{
    background:white;
    padding:40px 25px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    text-align:center;
}

.card h2{
    color:#123c69;
    margin-top:0;
}

.card p{
    color:#666;
    font-size:17px;
}

/* LANGUAGE BUTTONS */

.language-buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:30px;
}

.language-button{
    display:inline-block;
    min-width:220px;
    padding:18px 25px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    font-size:17px;
    transition:0.3s;
}

.language-button:hover{
    transform:translateY(-4px);
    box-shadow:0 7px 18px rgba(0,0,0,0.12);
}

/* HINDI */

.hindi{
    background:#fff3e0;
    color:#e65100;
    border:2px solid #ff9800;
}

/* ENGLISH */

.english{
    background:#e3f2fd;
    color:#1565c0;
    border:2px solid #1976d2;
}

/* BACK BUTTON */

.back{
    display:inline-block;
    margin-top:30px;
    padding:11px 22px;
    background:#123c69;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.back:hover{
    background:#0b2948;
}

/* FOOTER */

footer{
    background:#071d33;
    color:white;
    text-align:center;
    padding:30px 20px;
    margin-top:40px;
}

footer p{
    color:#cbd5e1;
}

/* MOBILE */

@media(max-width:600px){

    header h1{
        font-size:29px;
    }

    .language-buttons{
        flex-direction:column;
    }

    .language-button{
        width:100%;
    }

}

</style>

</head>


<body>

<div class="watermark">
GSI MANTRA
