<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSI MANTRA - Class 6 History MCQ</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .quiz {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .question {
            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd;
        }

        .question h3 {
            color: #123c69;
        }

        label {
            display: block;
            padding: 10px;
            margin: 8px 0;
            background: #f1f3f5;
            border-radius: 6px;
            cursor: pointer;
        }

        label:hover {
            background: #e1e7ef;
        }

        button {
            display: block;
            margin: 30px auto;
            padding: 14px 30px;
            background: #f28c00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #123c69;
            margin: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>GSI MANTRA</h1>
    <p>Class 6 History - Chapter 1 MCQ Test</p>
</header>

<div class="quiz">

    <div class="question">
        <h3>1. इतिहास हमें किसके बारे में जानकारी देता है?</h3>

        <label>
            <input type="radio" name="q1" value="a">
            भविष्य
        </label>

        <label>
            <input type="radio" name="q1" value="b">
            अतीत
        </label>

        <label>
            <input type="radio" name="q1" value="c">
            केवल वर्तमान
        </label>

        <label>
            <input type="radio" name="q1" value="d">
            मौसम
        </label>
    </div>


    <div class="question">
        <h3>2. निम्न में से कौन इतिहास का स्रोत है?</h3>

        <label>
            <input type="radio" name="q2" value="a">
            सिक्के
        </label>

        <label>
            <input type="radio" name="q2" value="b">
            केवल पेड़
        </label>

        <label>
            <input type="radio" name="q2" value="c">
            केवल बादल
        </label>

        <label>
            <input type="radio" name="q2" value="d">
            केवल हवा
        </label>
    </div>


    <div class="question">
        <h3>3. अभिलेख किस प्रकार का ऐतिहासिक स्रोत है?</h3>

        <label>
            <input type="radio" name="q3" value="a">
            लिखित स्रोत
        </label>

        <label>
            <input type="radio" name="q3" value="b">
            प्राकृतिक स्रोत
        </label>

        <label>
            <input type="radio" name="q3" value="c">
            मौसम संबंधी स्रोत
        </label>

        <label>
            <input type="radio" name="q3" value="d">
            इनमें से कोई नहीं
        </label>
    </div>


    <div class="question">
        <h3>4. पुरातत्वविद किसका अध्ययन करते हैं?</h3>

        <label>
            <input type="radio" name="q4" value="a">
            केवल मौसम
        </label>

        <label>
            <input type="radio" name="q4" value="b">
            प्राचीन वस्तुओं और अवशेषों
        </label>

        <label>
            <input type="radio" name="q4" value="c">
            केवल पेड़-पौधों
        </label>

        <label>
            <input type="radio" name="q4" value="d">
            केवल नदियों
        </label>
    </div>


    <div class="question">
        <h3>5. इतिहास के अध्ययन में समय को समझना क्यों जरूरी है?</h3>

        <label>
            <input type="radio" name="q5" value="a">
            घटनाओं का क्रम समझने के लिए
        </label>

        <label>
            <input type="radio" name="q5" value="b">
            मौसम जानने के लिए
        </label>

        <label>
            <input type="radio" name="q5" value="c">
            पेड़ गिनने के लिए
        </label>

        <label>
            <input type="radio" name="q5" value="d">
            इनमें से कोई नहीं
        </label>
    </div>


    <button onclick="checkAnswers()">Submit Quiz</button>

    <div id="result"></div>

</div>


<script>

function checkAnswers() {

    let score = 0;

    let answers = {
        q1: "b",
        q2: "a",
        q3: "a",
        q4: "b",
        q5: "a"
    };

    for (let question in answers) {

        let selected = document.querySelector(
            'input[name="' + question + '"]:checked'
        );

        if (selected && selected.value === answers[question]) {
            score++;
        }
    }

    document.getElementById("result").innerHTML =
        "आपका Score: " + score + " / 5";

}

</script>

</body>
</html>
